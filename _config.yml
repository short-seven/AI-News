
theme: jekyll-theme-cayman
title: 紧跟AI时事
description: 小七的AI News网站
baseurl: "/AI-News"
url: "https://short-seven.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
